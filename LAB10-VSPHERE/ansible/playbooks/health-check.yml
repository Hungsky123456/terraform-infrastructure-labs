---
- name: LAB10 - DEV web server health check
  hosts: dev
  become: false
  gather_facts: false
  any_errors_fatal: true

  pre_tasks:
    - name: Validate health check target
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'ubuntu-dev'
          - ansible_host == '192.168.174.154'
          - ansible_play_hosts_all | length == 1

  tasks:
    - name: Gather service status
      ansible.builtin.service_facts:

    - name: Verify Nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - ansible_facts.services['nginx.service'].state == 'running'
        fail_msg: "LAB10: Nginx service is not running."
        success_msg: "LAB10: Nginx service is running."

    - name: Verify local HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1:80/
        method: GET
        status_code: 200
        return_content: true
        timeout: 10
      register: http_response

    - name: Verify deployed web content
      ansible.builtin.assert:
        that:
          - "'Automated Web Server' in http_response.content"
          - "'Managed by Ansible' in http_response.content"
          - "'ubuntu-dev' in http_response.content"
        fail_msg: "LAB10: Unexpected web content."
        success_msg: "LAB10: Web content validation passed."

    - name: Verify HTTP access from controller
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:80/"
        method: GET
        status_code: 200
        return_content: true
        timeout: 10
      delegate_to: localhost
      register: controller_http_response

    - name: Verify controller received expected content
      ansible.builtin.assert:
        that:
          - "'Managed by Ansible' in controller_http_response.content"
          - "'ubuntu-dev' in controller_http_response.content"

    - name: Report health check result
      ansible.builtin.debug:
        msg: "LAB10: DEV Web Server Health Check PASSED."
