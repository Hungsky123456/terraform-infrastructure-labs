---
- name: LAB10 - Configure DEV web server
  hosts: dev
  become: true
  gather_facts: true
  any_errors_fatal: true

  pre_tasks:
    - name: Validate deployment target
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'ubuntu-dev'
          - ansible_host == '192.168.174.154'
          - ansible_hostname == 'ubuntu-dev'
          - ansible_user == 'ansible-svc'
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_major_version == '24'
          - terraform_vm_uuid == '420c4cc8-44ae-6f44-9bad-92b82085802b'
          - ansible_play_hosts_all | length == 1
        fail_msg: "LAB10: Unauthorized deployment target."
        success_msg: "LAB10: DEV target validation passed."

  roles:
    - common
    - nginx
