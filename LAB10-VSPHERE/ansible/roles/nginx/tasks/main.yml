---
- name: Install Nginx
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present

- name: Deploy web page from Jinja2 template
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_document_root }}/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Enable and start Nginx
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: true
